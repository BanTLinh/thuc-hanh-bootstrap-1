<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Người Dùng</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .bg-gradient-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .form-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-gradient-custom min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8">

    <div class="max-w-md w-full bg-white rounded-2xl form-shadow overflow-hidden">
        
        <!-- Header của Form -->
        <div class="bg-indigo-600 px-6 py-8 text-center text-white relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-indigo-500 rounded-full opacity-50"></div>
            <div class="absolute -left-10 -top-10 w-28 h-28 bg-indigo-700 rounded-full opacity-50"></div>
            
            <div class="relative z-10">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-white/10 rounded-full mb-3 backdrop-blur-sm">
                    <i class="fa-solid fa-user-plus text-2xl text-white"></i>
                </div>
                <h2 class="text-2xl font-bold tracking-tight">Đăng Ký Tài Khoản</h2>
                <p class="text-indigo-100 text-sm mt-1">Vui lòng điền đầy đủ thông tin bên dưới</p>
            </div>
        </div>

        <!-- Form gửi dữ liệu lên Server CodeGym -->
        <form 
            action="http://demo.codegym.vn/6/registration_form/register.php" 
            method="POST" 
            class="p-6 sm:p-8 space-y-5"
            id="registrationForm"
        >
            <!-- Trường 1: Họ và tên -->
            <div>
                <label for="name" class="block text-sm font-semibold text-gray-700 mb-1">
                    Họ và tên <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-regular fa-user"></i>
                    </div>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        required 
                        placeholder="Nguyễn Văn A" 
                        class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block transition-all duration-200 outline-none"
                    >
                </div>
            </div>

            <!-- Trường 2: Email -->
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">
                    Địa chỉ Email <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="example@gmail.com" 
                        class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block transition-all duration-200 outline-none"
                    >
                </div>
            </div>

            <!-- Trường 3: Số điện thoại -->
            <div>
                <label for="phone" class="block text-sm font-semibold text-gray-700 mb-1">
                    Số điện thoại <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-phone-flip text-xs"></i>
                    </div>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        required 
                        pattern="[0-9]{9,11}" 
                        placeholder="0987654321" 
                        class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block transition-all duration-200 outline-none"
                    >
                </div>
            </div>

            <!-- Trường 4: Giới tính -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Giới tính <span class="text-red-500">*</span>
                </label>
                <div class="grid grid-cols-3 gap-3">
                    <!-- Nam -->
                    <label class="relative flex items-center justify-center p-3 border border-gray-200 rounded-xl cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/50 transition-all duration-200">
                        <input type="radio" name="gender" value="Nam" required class="sr-only peer">
                        <div class="flex items-center space-x-2 text-gray-600 peer-checked:text-indigo-600 font-medium text-sm">
                            <i class="fa-solid fa-mars text-blue-500"></i>
                            <span>Nam</span>
                        </div>
                        <div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-indigo-600 pointer-events-none"></div>
                    </label>

                    <!-- Nữ -->
                    <label class="relative flex items-center justify-center p-3 border border-gray-200 rounded-xl cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/50 transition-all duration-200">
                        <input type="radio" name="gender" value="Nữ" class="sr-only peer">
                        <div class="flex items-center space-x-2 text-gray-600 peer-checked:text-indigo-600 font-medium text-sm">
                            <i class="fa-solid fa-venus text-pink-500"></i>
                            <span>Nữ</span>
                        </div>
                        <div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-indigo-600 pointer-events-none"></div>
                    </label>

                    <!-- Khác -->
                    <label class="relative flex items-center justify-center p-3 border border-gray-200 rounded-xl cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/50 transition-all duration-200">
                        <input type="radio" name="gender" value="Khác" class="sr-only peer">
                        <div class="flex items-center space-x-2 text-gray-600 peer-checked:text-indigo-600 font-medium text-sm">
                            <i class="fa-solid fa-genderless text-purple-500"></i>
                            <span>Khác</span>
                        </div>
                        <div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-indigo-600 pointer-events-none"></div>
                    </label>
                </div>
            </div>

            <!-- Nút Đăng Ký -->
            <div class="pt-2">
                <button 
                    type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 hover:shadow-indigo-300 active:scale-[0.99] transition-all duration-200 flex items-center justify-center space-x-2 cursor-pointer"
                >
                    <span>Đăng Ký Ngay</span>
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </form>
    </div>

</body>
</html>
